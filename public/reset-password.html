
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Reset Password — IPAN ULTRA</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      width: 100%;
      padding-right: 48px;
    }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }

    .eye-icon {
      display: block;
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body class="auth-body">
  <main class="auth-container">
    <a class="brand auth-brand" href="/">IPAN <span>ULTRA</span></a>

    <div class="auth-card">
      <section>
        <p class="eyebrow">Account recovery</p>
        <h1>Buat password baru.</h1>
        <p class="muted">Masukkan password baru untuk akun IPAN ULTRA kamu.</p>

        <form id="resetPasswordForm">
          <div class="field">
            <label for="newPassword">Password baru</label>
            <div class="password-wrap">
              <input id="newPassword" type="password"
                autocomplete="new-password" minlength="10" maxlength="128"
                required placeholder="Minimal 10 karakter">
              <button class="password-toggle" type="button"
                data-password-toggle="newPassword" aria-label="Lihat password"
                aria-pressed="false">
                <svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="field">
            <label for="confirmPassword">Ulangi password baru</label>
            <div class="password-wrap">
              <input id="confirmPassword" type="password"
                autocomplete="new-password" minlength="10" maxlength="128"
                required placeholder="Masukkan ulang password">
              <button class="password-toggle" type="button"
                data-password-toggle="confirmPassword" aria-label="Lihat password"
                aria-pressed="false">
                <svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <button id="resetSubmit" class="btn btn-primary btn-block" type="submit">
            Simpan Password Baru
          </button>
        </form>

        <p id="resetMessage" class="auth-message" role="status" aria-live="polite"></p>
        <a class="text-button back-link" href="/">← Kembali ke login</a>
      </section>
    </div>

    <p class="auth-footer">IPAN ULTRA · Catat perjalananmu, jaga konsistensimu.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase.js"></script>
  <script src="/reset-password.js" defer></script>
</body>
</html>
